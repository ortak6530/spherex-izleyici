[project]
name = "skytracker"
version = "0.1.0"
description = "SPHEREx Gökyüzü İzleyici - backend (FastAPI)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "astropy>=7.0",
    "pyvo>=1.6",
    "astroquery>=0.4.9",
    "numpy>=2.0",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]  # assert in tests; FastAPI's Depends() default-argument idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"alembic/*" = ["E501", "W291"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
