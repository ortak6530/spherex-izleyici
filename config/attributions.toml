# Every external resource the site uses (or will use), with its acknowledgement text.
# Shown on the "Kaynaklar" page (/#kaynaklar), mirrored in docs/SOURCES.md, written into Excel exports.
#
# Competition rule: EVERY resource used must be credited. Keep this file and docs/SOURCES.md in sync.
#
# Fields
#   key, title, group ("data" | "software"), status ("used" | "planned")
#   purpose       what the site uses it for (Turkish, shown to users)
#   url           main page
#   text          acknowledgement, copied VERBATIM from text_source (never paraphrased)
#   text_source   page the text was copied from; verified = date it was checked live
#   license       licence / terms, only as stated by the provider
#   citations     papers to cite: [{label, url}]
#   references    documentation / tutorials referred to: [{label, url}]
#   note          caveats (e.g. "official wording not found")

